<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Audio Signals Work — interactive tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{
    --paper:#fffaf0;
    --paper-2:#fffdf8;
    --ink:#172033;
    --ink-soft:#4b5870;
    --muted:#8b95a7;
    --line:#e7dfcf;
    --yellow:#ffd84d;
    --pink:#ff5c9d;
    --coral:#ff6b4a;
    --blue:#3d7cff;
    --cyan:#25d8d0;
    --green:#55d66b;
    --purple:#8b5cf6;
    --stage:#10172a;
    --stage-2:#172554;
    --stage-line:rgba(255,255,255,.12);
    --shadow:0 22px 70px rgba(30,41,59,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 12% 15%,rgba(255,216,77,.42),transparent 28%),
      radial-gradient(circle at 82% 8%,rgba(61,124,255,.22),transparent 30%),
      linear-gradient(135deg,#fff8e8 0%,#fffdf8 42%,#eef7ff 100%);
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }

  header{
    display:flex;align-items:center;gap:16px;padding:14px 24px 12px;
    border-bottom:1px solid rgba(231,223,207,.74);background:rgba(255,253,248,.84);
    backdrop-filter:blur(18px);z-index:2;
  }
  .brand{display:flex;align-items:center;gap:12px;font-family:"Fraunces",serif;font-weight:700;font-size:19px;letter-spacing:-.02em}
  .brandmark{
    width:36px;height:36px;border-radius:13px;background:conic-gradient(from 160deg,var(--yellow),var(--pink),var(--blue),var(--cyan),var(--yellow));
    box-shadow:0 8px 24px rgba(61,124,255,.22);position:relative;flex:none;
  }
  .brandmark:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--paper-2);box-shadow:inset 0 0 0 3px rgba(23,32,51,.08)}
  .brand em{font-style:normal;color:var(--pink)}
  .progress{margin-left:auto;display:flex;align-items:center;gap:14px}
  .dots{display:flex;gap:7px;align-items:center}
  .dots b{
    width:10px;height:10px;border-radius:999px;background:#d9d2c5;transition:.25s;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(23,32,51,.05)
  }
  .dots b:hover{transform:scale(1.25)}
  .dots b.on{width:28px;background:linear-gradient(90deg,var(--pink),var(--blue));transform:none}
  .dots b.done{background:var(--cyan);opacity:.75}
  .counter{font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--muted);white-space:nowrap}

  main{flex:1;display:flex;min-height:0;padding:18px;gap:18px}
  .theory{
    width:38%;max-width:560px;min-width:330px;overflow-y:auto;padding:32px 34px;
    border:1px solid rgba(231,223,207,.86);border-radius:28px;background:rgba(255,253,248,.94);
    box-shadow:var(--shadow);
  }
  .lesson-card{animation:fade .42s ease}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;
    background:#fff0f6;color:#c02667;font-family:"Spline Sans Mono",monospace;font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;font-weight:600;
  }
  .theory h1,.theory h2{font-family:"Fraunces",serif;font-weight:700;letter-spacing:-.035em}
  .theory h2{font-size:36px;line-height:1.04;margin-bottom:18px}
  .intuition{font-size:17px;line-height:1.72;color:var(--ink-soft)}
  .intuition b{color:var(--ink);font-weight:800}
  .takeaway{
    margin-top:22px;padding:16px 17px;border-radius:20px;background:linear-gradient(135deg,#fff4bf,#fff7e7);
    border:1px solid rgba(244,190,39,.35);color:#5b4210;font-size:15.5px;line-height:1.55;
  }
  .takeaway b{font-weight:800;color:#402900}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#edf7ff;
    color:#1e4e8c;font-family:"Spline Sans Mono",monospace;font-size:11px;font-weight:600;
  }
  .mathwrap{margin-top:24px;border-top:1px dashed var(--line);padding-top:18px}
  .mathtoggle{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:#f4f7ff;border:1px solid #dfe7ff;
    font-family:"Spline Sans Mono",monospace;font-size:12px;color:#2458cc;letter-spacing:.02em;
    padding:9px 12px;border-radius:12px;font-weight:600;
  }
  .mathtoggle .chev{transition:transform .25s}
  .mathtoggle.open .chev{transform:rotate(90deg)}
  .mathbody{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .3s;opacity:0;font-size:15px;line-height:1.7;color:var(--ink-soft)}
  .mathbody.open{max-height:820px;opacity:1;margin-top:16px}
  .mathbody p{margin-bottom:10px}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .stage{
    flex:1;min-width:0;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);position:relative;
    border:1px solid rgba(255,255,255,.42);
    background:
      radial-gradient(circle at 18% 16%,rgba(255,216,77,.18),transparent 22%),
      radial-gradient(circle at 82% 24%,rgba(37,216,208,.2),transparent 28%),
      linear-gradient(145deg,var(--stage),var(--stage-2));
    display:flex;flex-direction:column;
  }
  .stagecanvas{flex:1;position:relative;min-height:0;overflow:hidden}
  .stagecanvas canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .stagecanvas:before{
    content:"";position:absolute;inset:0;background-image:
      linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,.45));
    pointer-events:none;
  }
  .controls{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px 16px;
    border-top:1px solid var(--stage-line);background:rgba(8,13,31,.62);backdrop-filter:blur(16px);
  }
  .controls,.controls *{color:#edf6ff}
  .ctl{
    display:flex;align-items:center;gap:9px;font-family:"Spline Sans Mono",monospace;font-size:11px;
    color:#b6c6db;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:8px 10px;
  }
  .ctl label{white-space:nowrap;color:#b6c6db}
  input[type=range]{-webkit-appearance:none;appearance:none;height:6px;width:132px;border-radius:999px;background:rgba(255,255,255,.2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--yellow);cursor:pointer;border:3px solid #12203d;box-shadow:0 0 0 3px rgba(255,216,77,.22)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--yellow);cursor:pointer;border:3px solid #12203d;box-shadow:0 0 0 3px rgba(255,216,77,.22)}
  .val{color:var(--yellow);min-width:58px;font-weight:600}
  .seg{display:inline-flex;border:1px solid rgba(255,255,255,.12);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.05)}
  .seg button{background:transparent;border:none;color:#b6c6db;cursor:pointer;font-family:"Spline Sans Mono",monospace;font-size:11px;padding:7px 11px;transition:.16s}
  .seg button:not(:last-child){border-right:1px solid rgba(255,255,255,.1)}
  .seg button:hover{color:#fff;background:rgba(255,255,255,.1)}
  .seg button.active{background:linear-gradient(135deg,var(--yellow),var(--coral));color:#241006}
  .playbtn{
    display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--yellow),var(--coral));
    color:#241006;border:none;border-radius:14px;cursor:pointer;font-family:"Hanken Grotesk";font-weight:800;
    font-size:13px;padding:11px 16px;transition:.16s;box-shadow:0 8px 24px rgba(255,107,74,.22);
  }
  .playbtn:hover{transform:translateY(-1px)}
  .playbtn.on{background:#1e2a44;color:var(--yellow);box-shadow:inset 0 0 0 1px rgba(255,216,77,.7)}
  .axis-note{
    position:absolute;left:16px;top:14px;font-family:"Spline Sans Mono",monospace;font-size:10.5px;
    color:rgba(237,246,255,.7);letter-spacing:.05em;background:rgba(8,13,31,.56);border:1px solid rgba(255,255,255,.1);
    border-radius:999px;padding:7px 10px;z-index:1;
  }
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:rgba(237,246,255,.74);font-family:"Spline Sans Mono",monospace;font-size:12px;line-height:1.8;pointer-events:none;transition:opacity .4s;padding:24px;z-index:1}
  .hint b{color:var(--yellow)}
  .errmsg{color:#ffb3aa;font-family:"Spline Sans Mono",monospace;font-size:11px}
  .legend{
    position:absolute;right:16px;top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:1;
    font-family:"Spline Sans Mono",monospace;font-size:10px;color:rgba(237,246,255,.72);
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;background:rgba(8,13,31,.52);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:7px 9px}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

  footer{
    display:flex;align-items:center;gap:12px;padding:0 24px 18px;background:transparent;
  }
  .navbtn{
    display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(23,32,51,.1);background:rgba(255,253,248,.9);
    color:var(--ink);border-radius:15px;cursor:pointer;font-family:"Hanken Grotesk";font-weight:800;font-size:14px;
    padding:12px 20px;transition:.16s;box-shadow:0 10px 26px rgba(30,41,59,.08);
  }
  .navbtn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 30px rgba(30,41,59,.12)}
  .navbtn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .navbtn.next{margin-left:auto;background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .navbtn.next:hover{background:#0c1220}
  .steptitle{
    font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--muted);text-align:center;flex:1;letter-spacing:.02em;
  }

  @media (max-width:940px){
    body{overflow:auto;height:auto}
    main{flex-direction:column;overflow:visible}
    .theory{width:100%;max-width:none;min-width:0;max-height:none}
    .stage{min-height:56vh}
    footer{position:sticky;bottom:0;padding-top:12px;background:linear-gradient(to top,rgba(255,250,240,.98),rgba(255,250,240,.76))}
  }
  @media (max-width:620px){
    header{align-items:flex-start;flex-direction:column}
    .progress{margin-left:0;width:100%;justify-content:space-between}
    main{padding:12px;gap:12px}
    .theory{padding:24px 22px;border-radius:22px}
    .theory h2{font-size:30px}
    .stage{border-radius:22px}
    .controls{align-items:stretch}
    .ctl{width:100%;justify-content:space-between}
    input[type=range]{width:44vw}
  }
</style>
</head>
<body>
  <header>
    <span class="brand"><span class="brandmark" aria-hidden="true"></span>How Audio Signals Work <em>interactive</em></span>
    <div class="progress">
      <div class="dots" id="dots" aria-label="Tutorial steps"></div>
      <span class="counter" id="counter">01 / 09</span>
    </div>
  </header>

  <main>
    <section class="theory" id="theory" aria-live="polite"></section>
    <section class="stage">
      <div class="stagecanvas" id="stagecanvas"></div>
      <div class="controls" id="controls"></div>
    </section>
  </main>

  <footer>
    <button class="navbtn" id="back">← Back</button>
    <span class="steptitle" id="steptitle"></span>
    <button class="navbtn next" id="next">Next →</button>
  </footer>

<script>
(() => {
  "use strict";

  let AC = null;
  function ac(){
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    return AC;
  }

  const TAU = Math.PI * 2;
  const $ = (s,r=document)=>r.querySelector(s);
  const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
  function el(tag, cls, html){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(html != null) e.innerHTML=html;
    return e;
  }
  function fitCanvas(cv){
    const r=cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio || 1, 2);
    cv.width=Math.max(1, Math.round(r.width*dpr));
    cv.height=Math.max(1, Math.round(r.height*dpr));
    return dpr;
  }
  function roundedRect(ctx,x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }
  function drawStageTitle(ctx,dpr,text,sub){
    ctx.save();
    ctx.font=`${16*dpr}px "Spline Sans Mono", monospace`;
    ctx.fillStyle="rgba(237,246,255,.82)";
    ctx.fillText(text,22*dpr,56*dpr);
    if(sub){
      ctx.font=`${11*dpr}px "Spline Sans Mono", monospace`;
      ctx.fillStyle="rgba(237,246,255,.52)";
      ctx.fillText(sub,22*dpr,76*dpr);
    }
    ctx.restore();
  }
  function palette(i){
    return ["#ffd84d","#ff5c9d","#3d7cff","#25d8d0","#55d66b","#8b5cf6","#ff8a4c"][i%7];
  }

  function IntroViz(){
    let cv,ctx,raf,t=0;
    const words=["traffic","audio","image","gesture","code","sensor","voice","music","beacon","heartbeat"];
    return {
      controls:[
        {type:"seg",label:"View",opts:[["messages","Messages"],["function","Function"]],val:()=>mode,on:v=>mode=v}
      ],
      note:"a signal is a changing message",
      legend:[["#ffd84d","message"],["#25d8d0","measurable change"]],
      mount(host){ cv=el("canvas"); host.appendChild(cv); loop(); },
      unmount(){ cancelAnimationFrame(raf); }
    };
    let mode="messages";
    function loop(){ raf=requestAnimationFrame(loop); t+=0.018; draw(); }
    function draw(){
      const dpr=fitCanvas(cv), W=cv.width, H=cv.height; ctx=ctx || cv.getContext("2d");
      ctx.clearRect(0,0,W,H);
      drawStageTitle(ctx,dpr,"Signals carry messages","anything measurable that changes can become data");
      if(mode==="messages") drawMessages(dpr,W,H); else drawFunction(dpr,W,H);
    }
    function drawMessages(dpr,W,H){
      const cx=W/2, cy=H/2+10*dpr, orbit=Math.min(W,H)*0.27;
      ctx.save();
      ctx.lineWidth=2*dpr; ctx.strokeStyle="rgba(255,255,255,.12)";
      for(let r=0.36;r<=1;r+=0.32){ ctx.beginPath(); ctx.arc(cx,cy,orbit*r,0,TAU); ctx.stroke(); }
      words.forEach((word,i)=>{
        const a=t*0.8+i*TAU/words.length, r=orbit*(0.58+0.34*((i%3)/2));
        const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
        const w=(word.length*8+28)*dpr, h=34*dpr;
        roundedRect(ctx,x-w/2,y-h/2,w,h,17*dpr);
        ctx.fillStyle=`${palette(i)}dd`; ctx.fill();
        ctx.fillStyle="#10172a"; ctx.font=`700 ${12*dpr}px "Spline Sans Mono", monospace`;
        ctx.fillText(word,x-w/2+14*dpr,y+4*dpr);
      });
      const pulse=1+Math.sin(t*4)*0.05;
      ctx.beginPath(); ctx.arc(cx,cy,58*dpr*pulse,0,TAU); ctx.fillStyle="#fffaf0"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,42*dpr,0,TAU); ctx.fillStyle="#3d7cff"; ctx.fill();
      ctx.fillStyle="#fff"; ctx.font=`800 ${14*dpr}px "Hanken Grotesk"`; ctx.textAlign="center";
      ctx.fillText("SIGNAL",cx,cy+5*dpr); ctx.textAlign="left";
      ctx.restore();
    }
    function drawFunction(dpr,W,H){
      const left=70*dpr,right=W-40*dpr,mid=H*0.55,amp=H*.2;
      ctx.save();
      ctx.strokeStyle="rgba(255,255,255,.14)"; ctx.lineWidth=1*dpr;
      ctx.beginPath(); ctx.moveTo(left,mid); ctx.lineTo(right,mid); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(left,mid-amp-34*dpr); ctx.lineTo(left,mid+amp+34*dpr); ctx.stroke();
      ctx.strokeStyle="#25d8d0"; ctx.lineWidth=5*dpr; ctx.lineCap="round"; ctx.beginPath();
      for(let x=left;x<=right;x+=3*dpr){
        const u=(x-left)/(right-left);
        const y=mid-(Math.sin(u*TAU*2.1-t*1.8)*.62+Math.sin(u*TAU*5+t)*.22)*amp;
        x===left?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
      for(let i=0;i<11;i++){
        const u=i/10, x=left+u*(right-left);
        const y=mid-(Math.sin(u*TAU*2.1-t*1.8)*.62+Math.sin(u*TAU*5+t)*.22)*amp;
        ctx.beginPath(); ctx.arc(x,y,7*dpr,0,TAU); ctx.fillStyle=palette(i); ctx.fill();
      }
      ctx.fillStyle="rgba(237,246,255,.7)"; ctx.font=`${12*dpr}px "Spline Sans Mono"`;
      ctx.fillText("parameter: time, space, or anything measurable",left,mid+amp+62*dpr);
      ctx.fillText("value: pressure, brightness, voltage, position...",left,mid-amp-48*dpr);
      ctx.restore();
    }
  }

  function WaveViz(){
    let cv,ctx,raf,osc,gain,playing=false,freq=3,amp=0.7,phase=0,playHz=220,wave="sine";
    return {
      controls:[
        {type:"range",label:"Frequency",min:1,max:8,step:0.1,val:()=>freq,fmt:v=>v.toFixed(1)+"x",on:v=>{freq=v; playHz=110*v; if(osc) osc.frequency.value=playHz;}},
        {type:"range",label:"Amplitude",min:0.1,max:1,step:0.01,val:()=>amp,fmt:v=>v.toFixed(2),on:v=>{amp=v; if(gain) gain.gain.value=v*0.16;}},
        {type:"seg",label:"Shape",opts:[["sine","Sine"],["square","Square"],["sawtooth","Saw"]],val:()=>wave,on:v=>{wave=v; if(osc) osc.type=wave;}},
        {type:"play",label:()=>playing?"Stop":"Play tone",on:()=>toggle()}
      ],
      note:"x(t) = A sin(2 pi f t)",
      legend:[["#ff5c9d","wave"],["#ffd84d","air pressure samples"]],
      mount(host){ cv=el("canvas"); host.appendChild(cv); loop(); },
      unmount(){ cancelAnimationFrame(raf); stop(); }
    };
    function toggle(){ playing ? stop() : start(); }
    function start(){
      const c=ac(); osc=c.createOscillator(); gain=c.createGain();
      osc.type=wave; osc.frequency.value=playHz; gain.gain.value=amp*0.16;
      osc.connect(gain); gain.connect(c.destination); osc.start(); playing=true; refreshPlay();
    }
    function stop(){
      if(osc){ try{osc.stop();}catch(e){} osc.disconnect(); osc=null; }
      playing=false; refreshPlay();
    }
    function refreshPlay(){
      const b=document.querySelector(".playbtn");
      if(b){ b.classList.toggle("on",playing); b.textContent=playing?"■ Stop":"▶ Play tone"; }
    }
    function value(u){
      if(wave==="square") return Math.sign(Math.sin(u*freq*TAU-phase)) || 0;
      if(wave==="sawtooth") return 2*((u*freq-phase/TAU)%1)-1;
      return Math.sin(u*freq*TAU-phase);
    }
    function loop(){ raf=requestAnimationFrame(loop); phase+=0.035; draw(); }
    function draw(){
      const dpr=fitCanvas(cv),W=cv.width,H=cv.height; ctx=ctx||cv.getContext("2d");
      ctx.clearRect(0,0,W,H); drawStageTitle(ctx,dpr,"Wave anatomy","frequency controls pitch; amplitude controls loudness");
      const left=36*dpr,right=W-36*dpr,mid=H*.55,A=amp*H*.28;
      ctx.strokeStyle="rgba(255,255,255,.16)"; ctx.lineWidth=1*dpr;
      ctx.beginPath(); ctx.moveTo(left,mid); ctx.lineTo(right,mid); ctx.stroke();
      ctx.lineWidth=4*dpr; ctx.strokeStyle="#ff5c9d"; ctx.lineCap="round"; ctx.beginPath();
      for(let x=left;x<=right;x+=2*dpr){
        const u=(x-left)/(right-left), y=mid-value(u)*A;
        x===left?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.globalAlpha=.18; ctx.lineWidth=12*dpr; ctx.stroke(); ctx.globalAlpha=1;
      ctx.fillStyle="#ffd84d";
      for(let i=0;i<20;i++){
        const u=i/19, x=left+u*(right-left), y=mid-value(u)*A;
        ctx.beginPath(); ctx.arc(x,y,4.5*dpr,0,TAU); ctx.fill();
      }
      ctx.strokeStyle="#25d8d0"; ctx.lineWidth=2*dpr; ctx.setLineDash([5*dpr,6*dpr]);
      const ax=left+(right-left)*.16, ay=mid-value(.16)*A;

  function QuantizationViz(){
    let cv,ctx,raf,t=0,rate=24,bits=3;
    return {
      controls:[
        {type:"range",label:"Sample rate",min:8,max:72,step:1,val:()=>rate,fmt:v=>v+" /s",on:v=>rate=v},
        {type:"range",label:"Bit depth",min:2,max:8,step:1,val:()=>bits,fmt:v=>v+" bits",on:v=>bits=v}
      ],
      note:"x axis: sampling rate · y axis: bit depth",
      legend:[["#25d8d0","true wave"],["#ffd84d","quantized steps"],["#ff5c9d","rounding error"]],
      mount(host){ cv=el("canvas"); host.appendChild(cv); loop(); },
      unmount(){ cancelAnimationFrame(raf); }
    };
    function loop(){ raf=requestAnimationFrame(loop); t+=0.012; draw(); }
    function signal(u){ return .72*Math.sin(u*TAU*2-t*1.8)+.22*Math.sin(u*TAU*5+t); }
    function quant(y){ const levels=Math.pow(2,bits); return Math.round(((y+1)/2)*(levels-1))/(levels-1)*2-1; }
    function draw(){
      const dpr=fitCanvas(cv),W=cv.width,H=cv.height; ctx=ctx||cv.getContext("2d");
      ctx.clearRect(0,0,W,H); drawStageTitle(ctx,dpr,"Quantization: measuring height","bit depth decides how many vertical slots exist");
      const left=54*dpr,right=W-42*dpr,top=98*dpr,bottom=H-58*dpr,mid=(top+bottom)/2,A=(bottom-top)*.42;
      const levels=Math.pow(2,bits);
      ctx.strokeStyle="rgba(255,255,255,.11)"; ctx.lineWidth=1*dpr;
      for(let i=0;i<levels;i++){
        const q=-1+i/(levels-1)*2, y=mid-q*A;
        ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(right,y); ctx.stroke();
      }
      ctx.strokeStyle="#25d8d0"; ctx.lineWidth=3*dpr; ctx.beginPath();
      for(let x=left;x<=right;x+=2*dpr){ const u=(x-left)/(right-left), y=mid-signal(u)*A; x===left?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.stroke();
      const pts=[];
      for(let i=0;i<=rate;i++){ const u=i/rate, x=left+u*(right-left), y=signal(u), q=quant(y); pts.push([x,mid-y*A,mid-q*A]); }
      ctx.strokeStyle="#ffd84d"; ctx.lineWidth=4*dpr; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.beginPath();
      pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(p[0],p[2]); else { const prev=pts[i-1]; ctx.lineTo(p[0],prev[2]); ctx.lineTo(p[0],p[2]); }});
      ctx.stroke();
      pts.forEach(p=>{
        ctx.strokeStyle="rgba(255,92,157,.5)"; ctx.lineWidth=2*dpr; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0],p[2]); ctx.stroke();
        ctx.fillStyle="#ff5c9d"; ctx.beginPath(); ctx.arc(p[0],p[2],4*dpr,0,TAU); ctx.fill();
      });
      ctx.fillStyle="rgba(237,246,255,.7)"; ctx.font=`${12*dpr}px "Spline Sans Mono"`;
      ctx.fillText(`${levels} amplitude levels`,left,bottom+28*dpr);
      ctx.fillText("quantization error becomes noise",right-260*dpr,bottom+28*dpr);
    }
  }

  function SpectrogramViz(){
    let cv,gl,prog,tex,raf,analyser,srcNode,stream,freqData;
    let writeCol=0,HIST=1024,bins=1024,running=false;
    let source="tone",scale="log",gain=0.72,cmap=0;
    let uHead,uLog,uMinF,uGain,uMap;
    return {
      controls:[
        {type:"seg",label:"Source",opts:[["tone","Sweep"],["mic","Mic"],["file","File"]],val:()=>source,on:v=>{source=v; if(v==="file") fileEl.click(); restart();}},
        {type:"seg",label:"Scale",opts:[["log","Log"],["lin","Linear"]],val:()=>scale,on:v=>scale=v},
        {type:"range",label:"Gain",min:.4,max:1.25,step:.02,val:()=>gain,fmt:v=>v.toFixed(2),on:v=>gain=v},
        {type:"seg",label:"Color",opts:[["0","Sunset"],["1","Ocean"]],val:()=>String(cmap),on:v=>cmap=+v},
        {type:"play",label:()=>running?"Stop":"Start",on:()=>running?stop():start()}
      ],
      note:"time -> · frequency up · brightness = energy",
      hint:"Press <b>Start</b>. Sweep works everywhere; mic requires browser permission.",
      mount(host){
        cv=el("canvas"); host.appendChild(cv);
        gl=cv.getContext("webgl") || cv.getContext("experimental-webgl");
        if(!gl){ showErr("WebGL is not available in this browser."); return; }
        ensureFile(); initGL(); drawEmpty();
      },
      unmount(){ stop(); if(fileEl) fileEl.remove(); fileEl=null; }
    };
    let fileEl;
    function ensureFile(){
      if(!fileEl){
        fileEl=el("input"); fileEl.type="file"; fileEl.accept="audio/*"; fileEl.style.display="none";
        document.body.appendChild(fileEl);
        fileEl.addEventListener("change",()=>{ if(fileEl.files.length){ source="file"; restart(); }});
      }
    }
    const VERT=`attribute vec2 p; varying vec2 uv; void main(){ uv=p*0.5+0.5; gl_Position=vec4(p,0.,1.);}`;
    const FRAG=`
      precision mediump float; varying vec2 uv; uniform sampler2D tex;
      uniform float head, logScale, minF, gainv; uniform int cmap;
      vec3 sunset(float t){ return mix(vec3(0.05,0.08,0.2), mix(vec3(1.0,0.22,0.6), vec3(1.0,0.86,0.22), smoothstep(.45,1.0,t)), smoothstep(.02,1.0,t)); }
      vec3 ocean(float t){ return mix(vec3(0.04,0.08,0.18), mix(vec3(0.08,0.84,0.82), vec3(0.86,1.0,0.52), smoothstep(.55,1.0,t)), smoothstep(.02,1.0,t)); }
      void main(){
        float fN=(logScale>.5)?pow(minF,1.0-uv.y):uv.y;
        float m=texture2D(tex,vec2(uv.x+head,clamp(fN,0.0,1.0))).r;
        m=clamp(pow(m,gainv),0.0,1.0);
        vec3 c=(cmap==0)?sunset(m):ocean(m);
        gl_FragColor=vec4(c,1.0);
      }`;
    function compile(type,src){
      const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    }
    function initGL(){
      prog=gl.createProgram(); gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT)); gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const loc=gl.getAttribLocation(prog,"p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      uHead=gl.getUniformLocation(prog,"head"); uLog=gl.getUniformLocation(prog,"logScale"); uMinF=gl.getUniformLocation(prog,"minF");
      uGain=gl.getUniformLocation(prog,"gainv"); uMap=gl.getUniformLocation(prog,"cmap"); allocTex();
    }
    function allocTex(){
      tex=tex || gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,HIST,bins,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,new Uint8Array(HIST*bins));
      writeCol=0;
    }
    async function buildGraph(){
      const c=ac(); analyser=c.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=.55;
      bins=analyser.frequencyBinCount; freqData=new Uint8Array(bins); allocTex();
      if(source==="mic"){
        stream=await navigator.mediaDevices.getUserMedia({audio:true}); srcNode=c.createMediaStreamSource(stream); srcNode.connect(analyser);
      }else if(source==="tone"){
        const osc=c.createOscillator(), g=c.createGain(); g.gain.value=.13; osc.type="sawtooth";
        const t0=c.currentTime; osc.frequency.setValueAtTime(120,t0); osc.frequency.exponentialRampToValueAtTime(8000,t0+6);
        osc.frequency.exponentialRampToValueAtTime(120,t0+12); osc.connect(g); g.connect(analyser); g.connect(c.destination); osc.start(); srcNode=osc;
      }else if(source==="file"){
        ensureFile(); if(!fileEl.files.length) throw {soft:true};
        const ab=await fileEl.files[0].arrayBuffer(), dec=await c.decodeAudioData(ab), s=c.createBufferSource();
        s.buffer=dec; s.connect(analyser); analyser.connect(c.destination); s.start(); s.onended=stop; srcNode=s;
      }
    }
    async function start(){
      ensureFile(); clearErr();
      try{ await buildGraph(); running=true; hideHint(); refreshPlay(); loop(); }
      catch(e){ if(!(e&&e.soft)) showErr(e&&e.name==="NotAllowedError"?"Microphone permission denied.":("Error: "+(e.message||e))); stop(); }
    }
    function stop(){
      running=false; cancelAnimationFrame(raf);
      if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
      if(srcNode){ try{srcNode.stop && srcNode.stop();}catch(e){} try{srcNode.disconnect();}catch(e){} srcNode=null; }
      refreshPlay();
    }
    function restart(){ if(running){ stop(); start(); } }
    function loop(){
      if(!running) return; raf=requestAnimationFrame(loop);
      analyser.getByteFrequencyData(freqData); gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texSubImage2D(gl.TEXTURE_2D,0,writeCol,0,1,bins,gl.LUMINANCE,gl.UNSIGNED_BYTE,freqData);
      writeCol=(writeCol+1)%HIST; renderGL();
    }
    function renderGL(){
      const r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
      cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
      gl.viewport(0,0,cv.width,cv.height); gl.uniform1f(uHead,(writeCol+.5)/HIST); gl.uniform1f(uLog,scale==="log"?1:0);
      gl.uniform1f(uMinF,30/((AC?AC.sampleRate:44100)/2)); gl.uniform1f(uGain,gain); gl.uniform1i(uMap,cmap); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    function drawEmpty(){ if(gl) renderGL(); }
    function refreshPlay(){ const b=document.querySelector(".playbtn"); if(b){ b.classList.toggle("on",running); b.textContent=running?"■ Stop":"▶ Start"; } }
    function showErr(m){ const e=$("#sg-err"); if(e) e.textContent=m; }
    function clearErr(){ showErr(""); }
    function hideHint(){ const h=$("#stage-hint"); if(h) h.style.opacity="0"; }
  }
