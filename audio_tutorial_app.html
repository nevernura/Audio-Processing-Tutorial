      ctx.clearRect(0,0,W,H); drawStageTitle(ctx,dpr,"Mel scale: hearing is not linear","low frequencies get more perceptual detail");
      const left=72*dpr,right=W-54*dpr,y1=H*.42,y2=H*.62;
      drawRail(left,right,y1,"Linear Hz",normHz,dpr);
      drawRail(left,right,y2,"Mel scale",normMel,dpr);
      const selected=view==="hz"?normHz(toneHz):normMel(toneHz);
      const x=left+selected*(right-left);
      ctx.strokeStyle="#ff5c9d"; ctx.lineWidth=3*dpr; ctx.beginPath(); ctx.moveTo(x,y1-64*dpr); ctx.lineTo(x,y2+64*dpr); ctx.stroke();
      ctx.beginPath(); ctx.arc(x,view==="hz"?y1:y2,13*dpr+Math.sin(t*5)*2*dpr,0,TAU); ctx.fillStyle="#ff5c9d"; ctx.fill();
      ctx.fillStyle="#fff"; ctx.font=`700 ${13*dpr}px "Spline Sans Mono"`; ctx.fillText(`${Math.round(toneHz)} Hz`,x+16*dpr,(view==="hz"?y1:y2)+5*dpr);
      ctx.fillStyle="rgba(237,246,255,.66)"; ctx.font=`${12*dpr}px "Spline Sans Mono"`;
      ctx.fillText("500 -> 1000 Hz feels much larger than 10000 -> 10500 Hz, even with the same raw gap.",left,H-48*dpr);
    }
    function drawRail(left,right,y,label,map,dpr){
      ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=8*dpr; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(right,y); ctx.stroke();
      [125,250,500,1000,2000,4000,8000].forEach((f,i)=>{
        const x=left+map(f)*(right-left);
        ctx.fillStyle=label==="Mel scale"?"#25d8d0":"#ffd84d";
        ctx.beginPath(); ctx.arc(x,y,6*dpr,0,TAU); ctx.fill();
        ctx.fillStyle="rgba(237,246,255,.58)"; ctx.font=`${10*dpr}px "Spline Sans Mono"`;
        if(i%2===0) ctx.fillText(f>=1000?(f/1000)+"k":String(f),x-10*dpr,y+28*dpr);
      });
      ctx.fillStyle="rgba(237,246,255,.8)"; ctx.font=`700 ${13*dpr}px "Spline Sans Mono"`;
      ctx.fillText(label,left,y-24*dpr);
    }
  }

  function GalleryViz(){
    let cv,ctx,raf,t=0,kind="tone",playing=false,srcNode,gainNode;
    const kinds={
      tone:{label:"Pure tone",sub:"one horizontal stripe",color:"#ffd84d"},
      two:{label:"Two tones",sub:"two steady stripes",color:"#25d8d0"},
      chirp:{label:"Chirp",sub:"a rising diagonal",color:"#ff5c9d"},
      perc:{label:"Percussion",sub:"low thumps and broadband streaks",color:"#3d7cff"},
      voice:{label:"Voice",sub:"harmonic ladder with vibrato",color:"#8b5cf6"},
      bird:{label:"Birdsong",sub:"fast swooping curves",color:"#55d66b"}
    };
    return {
      controls:[
        {type:"seg",label:"Example",opts:Object.keys(kinds).map(k=>[k,kinds[k].label]),val:()=>kind,on:v=>{kind=v; if(playing){stop(); start();}}},
        {type:"play",label:()=>playing?"Stop":"Play example",on:()=>playing?stop():start()}
      ],
      note:"spectrogram reading practice",
      legend:[["#ffd84d","steady tone"],["#ff5c9d","moving pitch"],["#3d7cff","transient noise"]],
      mount(host){ cv=el("canvas"); host.appendChild(cv); loop(); },
      unmount(){ cancelAnimationFrame(raf); stop(); }
    };
    function loop(){ raf=requestAnimationFrame(loop); t+=0.018; draw(); }
    function draw(){
      const dpr=fitCanvas(cv),W=cv.width,H=cv.height; ctx=ctx||cv.getContext("2d");
      ctx.clearRect(0,0,W,H); drawStageTitle(ctx,dpr,kinds[kind].label,kinds[kind].sub);
      const left=54*dpr,right=W-44*dpr,top=94*dpr,bottom=H-58*dpr;
      ctx.fillStyle="rgba(8,13,31,.45)"; roundedRect(ctx,left,top,right-left,bottom-top,22*dpr); ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.12)"; ctx.lineWidth=1*dpr;
      for(let i=0;i<6;i++){ const y=top+i/5*(bottom-top); ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(right,y); ctx.stroke(); }
      for(let i=0;i<9;i++){ const x=left+i/8*(right-left); ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bottom); ctx.stroke(); }
      if(kind==="tone") drawTone(left,right,top,bottom,dpr,[.45],["#ffd84d"]);
      if(kind==="two") drawTone(left,right,top,bottom,dpr,[.38,.58],["#ffd84d","#25d8d0"]);
      if(kind==="chirp") drawChirp(left,right,top,bottom,dpr);
      if(kind==="perc") drawPerc(left,right,top,bottom,dpr);
      if(kind==="voice") drawVoice(left,right,top,bottom,dpr);
      if(kind==="bird") drawBird(left,right,top,bottom,dpr);
      ctx.fillStyle="rgba(237,246,255,.62)"; ctx.font=`${11*dpr}px "Spline Sans Mono"`;
      ctx.fillText("time ->",right-70*dpr,bottom+28*dpr); ctx.fillText("frequency",left,bottom+28*dpr);
    }
    function glowLine(points,color,dpr,width=3){
      ctx.strokeStyle=color; ctx.lineWidth=width*dpr; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.beginPath();
      points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
      ctx.globalAlpha=.16; ctx.lineWidth=(width+9)*dpr; ctx.stroke(); ctx.globalAlpha=1;
    }
    function drawTone(left,right,top,bottom,dpr,levels,colors){
      levels.forEach((lv,i)=>{ const y=bottom-lv*(bottom-top); glowLine([[left+20*dpr,y],[right-20*dpr,y]],colors[i],dpr,4); });
    }
    function drawChirp(left,right,top,bottom,dpr){
      const pts=[]; for(let i=0;i<120;i++){ const u=i/119; pts.push([left+u*(right-left), bottom-(.18+.68*u)*(bottom-top)]); }
      glowLine(pts,"#ff5c9d",dpr,4);
    }
    function drawPerc(left,right,top,bottom,dpr){
      for(let beat=0;beat<4;beat++){
        const x=left+(beat+.08)/4*(right-left);
        ctx.fillStyle="rgba(255,216,77,.62)"; roundedRect(ctx,x,bottom-(bottom-top)*.25,24*dpr,(bottom-top)*.22,12*dpr); ctx.fill();
        const sx=left+(beat+.55)/4*(right-left);
        const grad=ctx.createLinearGradient(sx,top,sx,bottom);
        grad.addColorStop(0,"rgba(61,124,255,.72)"); grad.addColorStop(1,"rgba(61,124,255,.05)");
        ctx.fillStyle=grad; roundedRect(ctx,sx-8*dpr,top+18*dpr,28*dpr,bottom-top-36*dpr,14*dpr); ctx.fill();
      }
    }
    function drawVoice(left,right,top,bottom,dpr){
      for(let k=1;k<=7;k++){
        const pts=[]; for(let i=0;i<140;i++){ const u=i/139, base=.12+k*.095; pts.push([left+u*(right-left), bottom-(base+Math.sin(u*TAU*5+t)*.012*k)*(bottom-top)]); }
        glowLine(pts, k%2?"#8b5cf6":"#25d8d0", dpr, 2.4);
      }
    }
    function drawBird(left,right,top,bottom,dpr){
      for(let call=0;call<5;call++){
        const pts=[]; const x0=(call+.12)/5, w=.12+.03*(call%2);
        for(let i=0;i<60;i++){ const u=i/59, x=left+(x0+u*w)*(right-left), y=bottom-(.62+.18*Math.sin(u*Math.PI)+.08*Math.sin(u*TAU*2+call))*(bottom-top); pts.push([x,y]); }
        glowLine(pts,"#55d66b",dpr,3);
      }
    }
    function start(){
      const c=ac(); gainNode=c.createGain(); gainNode.gain.value=.12; gainNode.connect(c.destination);
      if(kind==="tone" || kind==="two" || kind==="chirp" || kind==="voice"){
        const osc=c.createOscillator(); osc.type=kind==="voice"?"sawtooth":"sine";
        const now=c.currentTime;
        if(kind==="chirp"){ osc.frequency.setValueAtTime(180,now); osc.frequency.exponentialRampToValueAtTime(1800,now+2.4); }
        else osc.frequency.value=kind==="two"?330:kind==="voice"?220:440;
        osc.connect(gainNode); osc.start(); osc.stop(now+2.5); osc.onended=stop; srcNode=osc;
        if(kind==="two"){
          const osc2=c.createOscillator(); osc2.frequency.value=550; osc2.connect(gainNode); osc2.start(); osc2.stop(now+2.5); srcNode.extra=osc2;
        }
      }else{
        playNoisyPattern(c, kind);
      }
      playing=true; refreshPlay();
    }
    function playNoisyPattern(c,type){
      const dur=2.5, buffer=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate), data=buffer.getChannelData(0);
      for(let i=0;i<data.length;i++){
        const time=i/c.sampleRate; let v=0;
        if(type==="perc"){
          for(let b=0;b<4;b++){ const dt=time-b*.6; if(dt>=0&&dt<.18) v+=Math.sin(TAU*(120*Math.exp(-18*dt))*dt)*Math.exp(-18*dt); const st=time-(b*.6+.3); if(st>=0&&st<.12) v+=(Math.random()*2-1)*Math.exp(-32*st); }
        }else{
          const mod=Math.sin(TAU*(5+3*Math.sin(time*4))*time); v=Math.sin(TAU*(1900+700*mod)*time)*(.4+.6*Math.sin(TAU*7*time))*Math.exp(-.2*time);
        }
        data[i]=clamp(v*.45,-1,1);
      }
      const s=c.createBufferSource(); s.buffer=buffer; s.connect(gainNode); s.start(); s.onended=stop; srcNode=s;
    }
    function stop(){
      if(srcNode){ try{srcNode.stop&&srcNode.stop();}catch(e){} try{srcNode.disconnect();}catch(e){} if(srcNode.extra){try{srcNode.extra.stop();}catch(e){} try{srcNode.extra.disconnect();}catch(e){}} srcNode=null; }
      if(gainNode){ gainNode.disconnect(); gainNode=null; }
      playing=false; refreshPlay();
    }
    function refreshPlay(){ const b=document.querySelector(".playbtn"); if(b){ b.classList.toggle("on",playing); b.textContent=playing?"■ Stop":"▶ Play example"; } }
  }

  const STEPS = [
    {
      kicker:"01 · Signal basics", title:"A signal is a changing message", short:"Signal basics",
      intuition:`A signal is anything that carries information by <b>changing over something measurable</b>. The parameter might be time, space, or position. A traffic light, a heartbeat sensor, a picture, and a song all become signals once we measure their changing values.`,
      takeaway:`Notebook idea: signals feel broad, but the common thread is simple: <b>signals convey messages</b>.`,
      chips:["message","measurement","parameter"],
      math:`<p>A technical way to say this is: a signal is a function over a parameter.</p><p>For audio, the parameter is usually time, so we write $$x(t)$$ for continuous sound pressure and $$x[n]$$ for sampled digital audio.</p>`,
      viz:IntroViz
    },
    {
      kicker:"02 · Audio waves", title:"Sound is air pressure moving", short:"Audio wave",
      intuition:`Audio is a pressure wave travelling through air. When the pressure rises and falls smoothly, we hear a tone. The <b>frequency</b> controls pitch, while <b>amplitude</b> controls loudness. Try the wave shapes to hear how tone color changes too.`,
      takeaway:`A pure tone is the cleanest audio signal: one repeated wiggle over time.`,
      chips:["frequency = pitch","amplitude = loudness","wave shape = timbre"],
      math:`<p>A sinusoid is written as $$x(t)=A\\sin(2\\pi f t+\\varphi).$$</p><p>$A$ is amplitude, $f$ is frequency, and $\\varphi$ is phase. Digital audio stores samples of this curve.</p>`,
      viz:WaveViz
    },
    {
      kicker:"03 · Sampling", title:"Digital audio is snapshots in time", short:"Sampling rate",
      intuition:`A computer cannot store an infinitely smooth wave. It takes many <b>snapshots per second</b>. With enough snapshots, the dots trace the original wave. With too few, fast wiggles hide between dots and a false slower wave appears.`,
      takeaway:`The sample rate controls horizontal detail: how often the signal is measured.`,
      chips:["sample rate","Nyquist limit","aliasing"],
      math:`<p>A signal sampled at $f_s$ samples per second can represent frequencies below the Nyquist limit: $$f_\\text{max}=\\frac{f_s}{2}.$$</p><p>Frequencies above that fold back as aliases.</p>`,
      viz:SamplingViz
    },
    {
      kicker:"04 · Quantization", title:"Bit depth is height precision", short:"Bit depth",
      intuition:`Sampling chooses <b>when</b> to measure. Quantization chooses <b>which height</b> each measurement can use. Low bit depth gives the waveform chunky stair steps; high bit depth gives many more vertical levels and less rounding error.`,
      takeaway:`The notebook compares low-quality and high-quality digital signals: sample rate is x-axis detail, bit depth is y-axis detail.`,
      chips:["bit depth","rounding","noise"],
      math:`<p>With $b$ bits, the amplitude axis has $$2^b$$ possible levels.</p><p>The difference between the true wave height and the nearest available level is quantization error.</p>`,
      viz:QuantizationViz
    },
    {
      kicker:"05 · Frequency recipe", title:"Every sound is a stack of tones", short:"Fourier recipe",
      intuition:`Real sounds are not usually single tones. Fourier analysis says a complex wave can be described as a <b>recipe of simple sine waves</b>. The waveform shows what happens over time; the spectrum shows the ingredients.`,
      takeaway:`Move the ingredient sliders: changing the spectrum reshapes the wave immediately.`,
      chips:["DFT","FFT","spectrum"],
      math:`<p>The Discrete Fourier Transform converts $N$ samples into frequency coefficients:</p><p>$$X_k=\\sum_{n=0}^{N-1}x_n e^{-i2\\pi kn/N}.$$</p><p>The magnitude $|X_k|$ tells how much of frequency $k$ is present.</p>`,
      viz:SpectrumViz
    },
    {
      kicker:"06 · Windowing", title:"Spectrograms need small slices", short:"Windowing",
      intuition:`Music and speech change over time, so one spectrum for the whole clip is too blurry. Windowing cuts audio into short, overlapping frames. Each frame is short enough that the sound is nearly stable, and each frame becomes one column in a spectrogram.`,
      takeaway:`Short windows improve timing detail; longer windows improve frequency detail. There is always a tradeoff.`,
      chips:["frames","overlap","STFT"],
      math:`<p>The Short-Time Fourier Transform applies a window $w$ around each moment:</p><p>$$\\text{STFT}(m,k)=\\sum_n x[n]w[n-m]e^{-i2\\pi kn/N}.$$</p>`,
      viz:WindowViz
    },
    {
      kicker:"07 · Spectrogram", title:"See frequency change over time", short:"Live spectrogram",
      intuition:`A spectrogram stacks many spectra side by side. Time runs left to right, frequency rises upward, and brightness means energy. Start the sweep and watch pitch draw a diagonal line. Then try the mic or an audio file if your browser allows it.`,
      takeaway:`This is the browser version of the notebook's STFT and spectrogram plots.`,
      chips:["time","frequency","energy"],
      math:`<p>Most spectrograms display power in decibels:</p><p>$$S_\\text{dB}=20\\log_{10}|\\text{STFT}|.$$</p><p>Brighter colors mean larger magnitude in that time-frequency cell.</p>`,
      viz:SpectrogramViz
    },
    {
      kicker:"08 · Mel scale", title:"Our ears do not hear frequency linearly", short:"Mel scale",
      intuition:`Humans notice small frequency differences more easily at low frequencies than at high frequencies. The mel scale bends Hertz into a pitch scale that better matches hearing, which is why mel spectrograms are common in audio machine learning.`,
      takeaway:`The notebook formula turns Hertz into Mels and explains why equal Hertz gaps do not always feel equally far apart.`,
      chips:["Hertz","Mels","perception"],
      math:`<p>A common conversion is:</p><p>$$m=2595\\log_{10}\\left(1+\\frac{f}{700}\\right).$$</p><p>The curve grows quickly at first, then flattens for high frequencies.</p>`,
      viz:MelViz
    },
    {
      kicker:"09 · Reading sounds", title:"Spectrogram patterns tell stories", short:"Gallery",
      intuition:`Once you know the axes, spectrograms become readable pictures. A pure tone is a flat stripe. Two tones are two stripes. A chirp is a diagonal. Percussion is a burst. Voice and birdsong show moving harmonic curves.`,
      takeaway:`This gallery mirrors the notebook examples: pure tone, two tones, chirp, percussion, instruments, birdsong, and voice.`,
      chips:["tone","chirp","percussion","voice"],
      math:`<p>Harmonic sounds place energy near integer multiples of a fundamental frequency: $$f_k=kf_0.$$</p><p>Transient sounds are sharp in time and spread across frequency, which is one reason drums look like vertical streaks.</p>`,
      viz:GalleryViz
    }
  ];

  let idx=0,current=null;
  const theory=$("#theory"), stageCanvas=$("#stagecanvas"), controlsEl=$("#controls"),
        dotsEl=$("#dots"), counterEl=$("#counter"), backBtn=$("#back"), nextBtn=$("#next"),
        stepTitle=$("#steptitle");

  STEPS.forEach((s,i)=>{
    const d=el("b"); d.title=s.short; d.setAttribute("role","button"); d.setAttribute("tabindex","0");
    d.addEventListener("click",()=>go(i));
    d.addEventListener("keydown",e=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); go(i); }});
    dotsEl.appendChild(d);
  });

  function renderTheory(s){
    theory.innerHTML="";
    const wrap=el("div","lesson-card");
    wrap.appendChild(el("div","kicker",s.kicker));
    wrap.appendChild(el("h2",null,s.title));
    wrap.appendChild(el("p","intuition",s.intuition));
    if(s.takeaway) wrap.appendChild(el("div","takeaway",s.takeaway));
    if(s.chips && s.chips.length){
      const chips=el("div","chips");
      s.chips.forEach(c=>chips.appendChild(el("span","chip",c)));
      wrap.appendChild(chips);
    }
    const mw=el("div","mathwrap");
    const tog=el("button","mathtoggle",`<span class="chev">▶</span> Show the math`);
    const body=el("div","mathbody",s.math);
    tog.addEventListener("click",()=>{
      const open=body.classList.toggle("open");
      tog.classList.toggle("open",open);
      tog.innerHTML=`<span class="chev">▶</span> ${open?"Hide":"Show"} the math`;
      if(open) renderMath(body);
    });
    mw.append(tog,body); wrap.appendChild(mw); theory.appendChild(wrap);
  }

  function renderControls(viz){
    controlsEl.innerHTML="";
    (viz.controls || []).forEach(c=>{
      if(c.type==="range"){
        const w=el("div","ctl"), lab=el("label",null,c.label), inp=el("input");
        inp.type="range"; inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=c.val();
        const v=el("span","val",c.fmt?c.fmt(+inp.value):inp.value);
        inp.addEventListener("input",()=>{ c.on(+inp.value); v.textContent=c.fmt?c.fmt(+inp.value):inp.value; });
        w.append(lab,inp,v); controlsEl.appendChild(w);
      }else if(c.type==="seg"){
        const w=el("div","ctl"); w.appendChild(el("label",null,c.label));
        const seg=el("div","seg");
        c.opts.forEach(([val,txt])=>{
          const b=el("button",null,txt); b.classList.toggle("active",c.val()===val);
          b.addEventListener("click",()=>{ [...seg.children].forEach(x=>x.classList.remove("active")); b.classList.add("active"); c.on(val); });
          seg.appendChild(b);
        });
        w.appendChild(seg); controlsEl.appendChild(w);
      }else if(c.type==="play"){
        const b=el("button","playbtn",`▶ ${typeof c.label==="function"?c.label():c.label}`);
        b.addEventListener("click",()=>c.on()); controlsEl.appendChild(b);
      }
    });
    const err=el("span","errmsg"); err.id="sg-err"; controlsEl.appendChild(err);
  }

  function renderLegend(viz){
    if(!viz.legend || !viz.legend.length) return;
    const legend=el("div","legend");
    viz.legend.forEach(([color,label])=>legend.appendChild(el("span",null,`<i style="background:${color}"></i>${label}`)));
    stageCanvas.appendChild(legend);
  }

  function go(i){
    if(i<0 || i>=STEPS.length) return;
    if(current && current.unmount) current.unmount();
    stageCanvas.querySelectorAll("canvas,.hint,.axis-note,.legend").forEach(n=>n.remove());
    idx=i; const s=STEPS[i];
    renderTheory(s);
    const viz=s.viz(); current=viz;
    if(viz.note) stageCanvas.appendChild(el("div","axis-note",viz.note));
    renderLegend(viz);
    viz.mount(stageCanvas);
    if(viz.hint){ const h=el("div","hint",viz.hint); h.id="stage-hint"; stageCanvas.appendChild(h); }
    renderControls(viz);
    counterEl.textContent=`${String(i+1).padStart(2,"0")} / ${String(STEPS.length).padStart(2,"0")}`;
    [...dotsEl.children].forEach((d,j)=>{ d.classList.toggle("on",j===i); d.classList.toggle("done",j<i); d.setAttribute("aria-current",j===i?"step":"false"); });
    backBtn.disabled=i===0; nextBtn.disabled=i===STEPS.length-1;
    nextBtn.textContent=i===STEPS.length-1?"Done ✓":"Next →";
    stepTitle.textContent=s.short;
  }

  function renderMath(node){
    if(window.renderMathInElement){
      window.renderMathInElement(node,{delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"$",right:"$",display:false}
      ]});
    }
  }

  backBtn.addEventListener("click",()=>go(idx-1));
  nextBtn.addEventListener("click",()=>go(idx+1));
  window.addEventListener("keydown",e=>{
    if(e.target && ["INPUT","BUTTON"].includes(e.target.tagName)) return;
    if(e.key==="ArrowRight") go(idx+1);
    if(e.key==="ArrowLeft") go(idx-1);
  });
  window.addEventListener("resize",()=>go(idx));
  window.addEventListener("load",()=>go(0));
  if(document.readyState==="complete") go(0);
})();
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Sound Works — an interactive tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{
    --paper:#f7f3ec;
    --paper-2:#fffdf9;
    --ink:#1b1815;
    --ink-soft:#534d45;
    --muted:#928a7d;
    --line:#e6ded1;
    --coral:#ff5630;
    --coral-deep:#e4421f;
    --blue:#2f6df0;
    --stage:#0c0c12;
    --stage-line:#23232e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:16px;padding:14px 26px;
    border-bottom:1px solid var(--line);background:var(--paper-2);
  }
  .brand{font-family:"Fraunces",serif;font-weight:600;font-size:18px;letter-spacing:-.01em}
  .brand em{font-style:italic;color:var(--coral)}
  .progress{margin-left:auto;display:flex;align-items:center;gap:14px}
  .dots{display:flex;gap:7px}
  .dots b{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.3s;cursor:pointer}
  .dots b.on{background:var(--coral);transform:scale(1.15)}
  .dots b.done{background:var(--coral-deep);opacity:.45}
  .counter{font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--muted)}

  /* ---------- main split ---------- */
  main{flex:1;display:flex;min-height:0}
  .theory{
    width:40%;max-width:520px;min-width:320px;padding:40px 44px;overflow-y:auto;
    border-right:1px solid var(--line);background:var(--paper-2);
  }
  .kicker{font-family:"Spline Sans Mono",monospace;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--coral);margin-bottom:14px}
  .theory h2{font-family:"Fraunces",serif;font-weight:600;font-size:34px;line-height:1.08;
    letter-spacing:-.02em;margin-bottom:20px}
  .theory .intuition{font-size:16.5px;line-height:1.72;color:var(--ink-soft)}
  .theory .intuition b{color:var(--ink);font-weight:600}
  .mathwrap{margin-top:26px;border-top:1px dashed var(--line);padding-top:18px}
  .mathtoggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:none;border:none;
    font-family:"Spline Sans Mono",monospace;font-size:12.5px;color:var(--blue);letter-spacing:.02em;padding:0}
  .mathtoggle .chev{transition:transform .25s}
  .mathtoggle.open .chev{transform:rotate(90deg)}
  .mathbody{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .3s;opacity:0;
    font-size:15px;line-height:1.7;color:var(--ink-soft)}
  .mathbody.open{max-height:600px;opacity:1;margin-top:16px}
  .mathbody p{margin-bottom:10px}

  .stepfade{animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- visual stage ---------- */
  .stage{flex:1;min-width:0;background:
      radial-gradient(900px 500px at 60% -10%,#16161f 0%,var(--stage) 60%),var(--stage);
    display:flex;flex-direction:column;position:relative}
  .stagecanvas{flex:1;position:relative;min-height:0}
  .stagecanvas canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .controls{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 22px;border-top:1px solid var(--stage-line);
  }
  .controls,.controls *{color:#d9d7d0}
  .ctl{display:flex;align-items:center;gap:9px;font-family:"Spline Sans Mono",monospace;font-size:11px;color:#8a8a96}
  .ctl label{white-space:nowrap}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;width:128px;border-radius:3px;
    background:#2b2b38;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--coral);cursor:pointer;border:2px solid #1a1410}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--coral);
    cursor:pointer;border:2px solid #1a1410}
  .val{color:var(--coral);min-width:54px}
  .seg{display:inline-flex;border:1px solid var(--stage-line);border-radius:9px;overflow:hidden}
  .seg button{background:transparent;border:none;color:#8a8a96;cursor:pointer;
    font-family:"Spline Sans Mono",monospace;font-size:11.5px;padding:7px 12px;transition:.16s}
  .seg button:not(:last-child){border-right:1px solid var(--stage-line)}
  .seg button:hover{color:#fff;background:#1c1c26}
  .seg button.active{background:var(--coral);color:#1a1006}
  .playbtn{display:inline-flex;align-items:center;gap:8px;background:var(--coral);color:#1a1006;border:none;
    border-radius:9px;cursor:pointer;font-family:"Hanken Grotesk";font-weight:700;font-size:12.5px;padding:9px 16px;transition:.16s}
  .playbtn:hover{background:#ff6f4d}
  .playbtn.on{background:#2a1a12;color:var(--coral);box-shadow:inset 0 0 0 1px var(--coral)}
  .axis-note{position:absolute;left:14px;top:12px;font-family:"Spline Sans Mono",monospace;font-size:10px;
    color:#5b5b67;letter-spacing:.05em}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    color:#6a6a76;font-family:"Spline Sans Mono",monospace;font-size:12px;line-height:1.8;
    pointer-events:none;transition:opacity .4s;padding:24px}
  .hint b{color:var(--coral)}
  .errmsg{color:#ff7a6b;font-family:"Spline Sans Mono",monospace;font-size:11px}

  /* ---------- footer nav ---------- */
  footer{display:flex;align-items:center;gap:12px;padding:14px 26px;border-top:1px solid var(--line);
    background:var(--paper-2)}
  .navbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper-2);
    color:var(--ink);border-radius:11px;cursor:pointer;font-family:"Hanken Grotesk";font-weight:600;font-size:14px;
    padding:11px 20px;transition:.16s}
  .navbtn:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
  .navbtn:disabled{opacity:.35;cursor:not-allowed}
  .navbtn.next{margin-left:auto;background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .navbtn.next:hover{background:#000}
  .steptitle{font-family:"Spline Sans Mono",monospace;font-size:11.5px;color:var(--muted);
    text-align:center;flex:1;letter-spacing:.02em}

  @media (max-width:860px){
    main{flex-direction:column}
    .theory{width:100%;max-width:none;min-width:0;border-right:none;border-bottom:1px solid var(--line);
      padding:26px 24px;max-height:46%}
    .theory h2{font-size:27px}
  }
</style>
</head>
<body>
  <header>
    <span class="brand">How Sound Works <em>— interactive</em></span>
    <div class="progress">
      <div class="dots" id="dots"></div>
      <span class="counter" id="counter">01 / 04</span>
    </div>
  </header>

  <main>
    <section class="theory" id="theory"></section>
    <section class="stage">
      <div class="stagecanvas" id="stagecanvas"></div>
      <div class="controls" id="controls"></div>
    </section>
  </main>

  <footer>
    <button class="navbtn" id="back">← Back</button>
    <span class="steptitle" id="steptitle"></span>
    <button class="navbtn next" id="next">Next →</button>
  </footer>

<script>
(() => {
  "use strict";

  // ===== shared audio context (created on first user gesture) =====
  let AC = null;
  function ac(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume(); return AC; }

  // ===== small helpers =====
  const $ = (s,r=document)=>r.querySelector(s);
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
  function fitCanvas(cv){
    const r=cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.max(1,r.width*dpr|0); cv.height=Math.max(1,r.height*dpr|0);
    return dpr;
  }

  // =========================================================
  //  VISUAL 1 — a pure wave (freq + amplitude, playable)
  // =========================================================
  function WaveViz(){
    let cv,ctx,raf,osc,gain,playing=false,freq=3,amp=0.7,phase=0,playHz=220;
    return {
      controls:[
        {type:"range",label:"Frequency",min:1,max:8,step:0.1,val:()=>freq,fmt:v=>v.toFixed(1)+"×",
          on:v=>{freq=v; playHz=110*v; if(osc)osc.frequency.value=playHz;}},
        {type:"range",label:"Amplitude",min:0.1,max:1,step:0.01,val:()=>amp,fmt:v=>v.toFixed(2),
          on:v=>{amp=v; if(gain)gain.gain.value=v*0.18;}},
        {type:"play",label:()=>playing?"Stop":"Play tone",on:()=>toggle()}
      ],
      note:"x(t) = A · sin(2π f t)",
      mount(host){
        cv=el("canvas"); host.appendChild(cv);
        const loop=()=>{ raf=requestAnimationFrame(loop); draw(); };
        loop();
      },
      unmount(){ cancelAnimationFrame(raf); stop(); }
    };
    function toggle(){ playing?stop():start(); }
    function start(){ const c=ac(); osc=c.createOscillator(); gain=c.createGain();
      osc.frequency.value=playHz; gain.gain.value=amp*0.18; osc.connect(gain); gain.connect(c.destination);
      osc.start(); playing=true; refreshPlay(); }
    function stop(){ if(osc){try{osc.stop()}catch(e){} osc.disconnect(); osc=null;} playing=false; refreshPlay(); }
    function refreshPlay(){ const b=document.querySelector(".playbtn"); if(b){b.classList.toggle("on",playing); b.textContent=playing?"■ Stop":"▶ Play tone";} }
    function draw(){
      const dpr=fitCanvas(cv),W=cv.width,H=cv.height; ctx=ctx||cv.getContext("2d");
      ctx.clearRect(0,0,W,H);
      // midline
      ctx.strokeStyle="#23232e"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
      phase+=0.03;
      ctx.lineWidth=3*dpr; ctx.strokeStyle="#ff5630"; ctx.lineCap="round"; ctx.beginPath();
      for(let x=0;x<=W;x++){ const t=x/W;
        const y=H/2 - Math.sin(t*freq*2*Math.PI - phase)*amp*(H*0.36);
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
      // glow
      ctx.globalAlpha=0.18; ctx.lineWidth=9*dpr; ctx.stroke(); ctx.globalAlpha=1;
    }
  }

  // =========================================================
  //  VISUAL 2 — sampling & aliasing
  // =========================================================
  function SamplingViz(){
    let cv,ctx,raf,phase=0,rate=20,showRecon=true,sigHz=3;
    return {
      controls:[
        {type:"range",label:"Sample rate",min:4,max:60,step:1,val:()=>rate,fmt:v=>v+" /s",on:v=>rate=v},
        {type:"seg",label:"Reconstruction",opts:[["on","Show"],["off","Hide"]],val:()=>showRecon?"on":"off",
          on:v=>showRecon=(v==="on")}
      ],
      note:"capture rate vs. the wave",
      mount(host){ cv=el("canvas"); host.appendChild(cv);
        const loop=()=>{raf=requestAnimationFrame(loop);draw();}; loop(); },
      unmount(){ cancelAnimationFrame(raf); }
    };
    function draw(){
      const dpr=fitCanvas(cv),W=cv.width,H=cv.height; ctx=ctx||cv.getContext("2d");
      ctx.clearRect(0,0,W,H); phase+=0.012;
      ctx.strokeStyle="#23232e"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
      const cyc=sigHz; // cycles across the width
      // true analog wave (faint)
      ctx.strokeStyle="#4a4a5a"; ctx.lineWidth=2.5*dpr; ctx.beginPath();
      for(let x=0;x<=W;x++){const t=x/W; const y=H/2-Math.sin(t*cyc*2*Math.PI - phase)*(H*0.34);
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();
      // samples
      const N=rate, pts=[];
      for(let i=0;i<=N;i++){ const t=i/N; const x=t*W;
        const y=H/2-Math.sin(t*cyc*2*Math.PI - phase)*(H*0.34); pts.push([x,y]); }
      // reconstruction (straight lines between samples = what the computer "knows")
      if(showRecon){ ctx.strokeStyle="#2f6df0"; ctx.lineWidth=2.5*dpr; ctx.beginPath();
        pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); }
      ctx.fillStyle="#ff5630";
      pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4.5*dpr,0,7);ctx.fill();});
      // verdict text
      const ok = rate >= cyc*2.2;
      ctx.font=`${13*dpr}px "Spline Sans Mono",monospace`;
      ctx.fillStyle = ok?"#39d7c4":"#ff7a6b";
      ctx.fillText(ok?"rate above Nyquist — wave preserved":"too few samples — aliasing!", 16*dpr, H-18*dpr);
    }
  }

  // =========================================================
  //  VISUAL 3 — a wave is a sum of tones (Fourier recipe)
  // =========================================================
  function SpectrumViz(){
    let cv,ctx,raf,phase=0;
    const comps=[{f:1,a:0.8},{f:2,a:0.0},{f:3,a:0.0}];
    return {
      controls:[
        {type:"range",label:"Tone 1",min:0,max:1,step:0.01,val:()=>comps[0].a,fmt:v=>v.toFixed(2),on:v=>comps[0].a=v},
        {type:"range",label:"Tone 2",min:0,max:1,step:0.01,val:()=>comps[1].a,fmt:v=>v.toFixed(2),on:v=>comps[1].a=v},
        {type:"range",label:"Tone 3",min:0,max:1,step:0.01,val:()=>comps[2].a,fmt:v=>v.toFixed(2),on:v=>comps[2].a=v},
      ],
      note:"left: the wave · right: its recipe",
      mount(host){ cv=el("canvas"); host.appendChild(cv);
        const loop=()=>{raf=requestAnimationFrame(loop);draw();}; loop(); },
      unmount(){ cancelAnimationFrame(raf); }
    };
    function draw(){
      const dpr=fitCanvas(cv),W=cv.width,H=cv.height; ctx=ctx||cv.getContext("2d");
      ctx.clearRect(0,0,W,H); phase+=0.03;
      const split=W*0.6;
      // ---- left: combined wave ----
      ctx.strokeStyle="#23232e"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(split,H/2); ctx.stroke();
      let amax=comps.reduce((s,c)=>s+c.a,0)||1;
      ctx.strokeStyle="#ff5630"; ctx.lineWidth=3*dpr; ctx.lineCap="round"; ctx.beginPath();
      for(let x=0;x<=split;x++){ const t=x/split; let y=0;
        comps.forEach(c=>{ y+=c.a*Math.sin(t*c.f*2*Math.PI*3 - phase*c.f); });
        const py=H/2 - (y/amax)*(H*0.32); x===0?ctx.moveTo(x,py):ctx.lineTo(x,py); }
      ctx.stroke();
      // divider
      ctx.strokeStyle="#23232e"; ctx.beginPath(); ctx.moveTo(split,18); ctx.lineTo(split,H-18); ctx.stroke();
      // ---- right: spectrum stems ----
      const bx0=split+34*dpr, bw=(W-bx0-24*dpr), base=H-46*dpr;
      ctx.strokeStyle="#3a3a48"; ctx.lineWidth=1.5*dpr; ctx.beginPath(); ctx.moveTo(bx0-10*dpr,base); ctx.lineTo(W-16*dpr,base); ctx.stroke();
      ctx.font=`${11*dpr}px "Spline Sans Mono",monospace`; ctx.fillStyle="#8a8a96";
      comps.forEach((c,i)=>{ const x=bx0 + (i+0.5)/comps.length*bw;
        const h=c.a*(H*0.5); ctx.strokeStyle="#2f6df0"; ctx.lineWidth=10*dpr; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(x,base); ctx.lineTo(x,base-h-1); ctx.stroke();
        ctx.fillStyle="#8a8a96"; ctx.fillText("f"+(i+1), x-7*dpr, base+20*dpr); });
      ctx.fillStyle="#5b5b67"; ctx.fillText("frequency →", bx0-10*dpr, H-16*dpr);
    }
  }

  // =========================================================
  //  VISUAL 4 — live WebGL spectrogram
  // =========================================================
  function SpectrogramViz(){
    let cv,gl,prog,tex,raf,analyser,srcNode,stream,freqData;
    let writeCol=0, HIST=1024, bins=1024, running=false;
    let source="tone", scale="log", gain=0.7, cmap=0;
    let uHead,uLog,uMinF,uGain,uMap;
    return {
      controls:[
        {type:"seg",label:"Source",opts:[["mic","Mic"],["file","File"],["tone","Sweep"]],val:()=>source,
          on:v=>{source=v; if(v==="file")fileEl.click(); restart();}},
        {type:"seg",label:"Scale",opts:[["log","Log"],["lin","Linear"]],val:()=>scale,on:v=>scale=v},
        {type:"range",label:"Gain",min:0.4,max:1.2,step:0.02,val:()=>gain,fmt:v=>v.toFixed(2),on:v=>gain=v},
        {type:"seg",label:"Colour",opts:[["0","Inferno"],["1","Viridis"]],val:()=>String(cmap),on:v=>cmap=+v},
        {type:"play",label:()=>running?"Stop":"Start",on:()=>running?stop():start()}
      ],
      note:"time → · frequency ↑ · brightness = energy",
      hint:"Press <b>Start</b>. Mic may be blocked in-page — <b>Sweep</b> always works (watch the diagonal climb).",
      mount(host){ cv=el("canvas"); host.appendChild(cv);
        gl=cv.getContext("webgl")||cv.getContext("experimental-webgl");
        if(!gl){ showErr("WebGL not available in this browser."); return; }
        ensureFile();
        initGL();
      },
      unmount(){ stop(); }
    };

    let fileEl;
    function ensureFile(){ if(!fileEl){ fileEl=el("input"); fileEl.type="file"; fileEl.accept="audio/*";
      fileEl.style.display="none"; document.body.appendChild(fileEl);
      fileEl.addEventListener("change",()=>{ if(fileEl.files.length){source="file"; restart();}}); } }

    const VERT=`attribute vec2 p; varying vec2 uv; void main(){ uv=p*0.5+0.5; gl_Position=vec4(p,0.,1.);}`;
    const FRAG=`
      precision mediump float; varying vec2 uv; uniform sampler2D tex;
      uniform float head, logScale, minF, gainv; uniform int cmap;
      vec3 inferno(float t){
        const vec3 c0=vec3(0.00021894,0.00165100,-0.01948090);
        const vec3 c1=vec3(0.10651342,0.56395644,3.93271239);
        const vec3 c2=vec3(11.6024931,-3.97285397,-15.9423941);
        const vec3 c3=vec3(-41.7039961,17.4363989,44.3541452);
        const vec3 c4=vec3(77.1629357,-33.4023589,-81.8073093);
        const vec3 c5=vec3(-71.3194282,32.6260643,73.2095199);
        const vec3 c6=vec3(25.1311262,-12.2426690,-23.0703250);
        return c0+t*(c1+t*(c2+t*(c3+t*(c4+t*(c5+t*c6)))));
      }
      vec3 viridis(float t){
        const vec3 c0=vec3(0.27772733,0.00540734,0.33409981);
        const vec3 c1=vec3(0.10509304,1.40461353,1.38459016);
        const vec3 c2=vec3(-0.33086183,0.21484756,0.09509516);
        const vec3 c3=vec3(-4.63423050,-5.79910097,-19.33244096);
        const vec3 c4=vec3(6.22826994,14.17993337,56.69055260);
        const vec3 c5=vec3(4.77638500,-13.74514538,-65.35303263);
        const vec3 c6=vec3(-5.43545586,4.64585261,26.31243525);
        return c0+t*(c1+t*(c2+t*(c3+t*(c4+t*(c5+t*c6)))));
      }
      void main(){
        float fN = (logScale>0.5) ? pow(minF, 1.0-uv.y) : uv.y;
        float m = texture2D(tex, vec2(uv.x+head, clamp(fN,0.0,1.0))).r;
        m = clamp(pow(m, gainv), 0.0, 1.0);
        vec3 c = (cmap==0) ? inferno(m) : viridis(m);
        gl_FragColor = vec4(c,1.0);
      }`;
    function compile(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
    function initGL(){
      prog=gl.createProgram();
      gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
      gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const loc=gl.getAttribLocation(prog,"p"); gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      uHead=gl.getUniformLocation(prog,"head"); uLog=gl.getUniformLocation(prog,"logScale");
      uMinF=gl.getUniformLocation(prog,"minF"); uGain=gl.getUniformLocation(prog,"gainv");
      uMap=gl.getUniformLocation(prog,"cmap");
      allocTex();
    }
    function allocTex(){
      tex=tex||gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,HIST,bins,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,
        new Uint8Array(HIST*bins));
      writeCol=0;
    }
    async function buildGraph(){
      const c=ac(); analyser=c.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=0.55;
      bins=analyser.frequencyBinCount; freqData=new Uint8Array(bins); allocTex();
      if(source==="mic"){ stream=await navigator.mediaDevices.getUserMedia({audio:true});
        srcNode=c.createMediaStreamSource(stream); srcNode.connect(analyser);
      } else if(source==="tone"){ const osc=c.createOscillator(),g=c.createGain(); g.gain.value=0.14;
        osc.type="sawtooth"; const t0=c.currentTime;
        osc.frequency.setValueAtTime(120,t0);
        osc.frequency.exponentialRampToValueAtTime(8000,t0+6);
        osc.frequency.exponentialRampToValueAtTime(120,t0+12);
        osc.connect(g); g.connect(analyser); g.connect(c.destination); osc.start(); srcNode=osc;
      } else if(source==="file"){ ensureFile();
        if(!fileEl.files.length){ throw {soft:true}; }
        const ab=await fileEl.files[0].arrayBuffer(); const dec=await c.decodeAudioData(ab);
        const s=c.createBufferSource(); s.buffer=dec; s.connect(analyser); analyser.connect(c.destination);
        s.start(); s.onended=stop; srcNode=s;
      }
    }
    async function start(){
      ensureFile(); clearErr();
      try{ await buildGraph(); running=true; hideHint(); refreshPlay(); loop(); }
      catch(e){ if(!(e&&e.soft)) showErr(e&&e.name==="NotAllowedError"?"Microphone permission denied.":("Error: "+(e.message||e))); stop(); }
    }
    function stop(){ running=false; cancelAnimationFrame(raf);
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
      if(srcNode){try{srcNode.stop&&srcNode.stop()}catch(e){} try{srcNode.disconnect()}catch(e){} srcNode=null;}
      refreshPlay(); }
    function restart(){ if(running){stop(); start();} }
    function loop(){ if(!running)return; raf=requestAnimationFrame(loop);
      analyser.getByteFrequencyData(freqData);
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texSubImage2D(gl.TEXTURE_2D,0,writeCol,0,1,bins,gl.LUMINANCE,gl.UNSIGNED_BYTE,freqData);
      writeCol=(writeCol+1)%HIST;
      const r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
      cv.width=Math.max(1,r.width*dpr|0); cv.height=Math.max(1,r.height*dpr|0);
      gl.viewport(0,0,cv.width,cv.height);
      gl.uniform1f(uHead,(writeCol+0.5)/HIST);
      gl.uniform1f(uLog,scale==="log"?1:0);
      gl.uniform1f(uMinF, 30/(AC.sampleRate/2));
      gl.uniform1f(uGain,gain);
      gl.uniform1i(uMap,cmap);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    function refreshPlay(){ const b=document.querySelector(".playbtn"); if(b){b.classList.toggle("on",running); b.textContent=running?"■ Stop":"▶ Start";} }
    function showErr(m){ const e=$("#sg-err"); if(e)e.textContent=m; }
    function clearErr(){ showErr(""); }
    function hideHint(){ const h=$("#stage-hint"); if(h)h.style.opacity="0"; }
  }

  // =========================================================
  //  STEP CONTENT
  // =========================================================
  const STEPS = [
    { kicker:"01 · The signal", title:"Sound is a wave",
      short:"Sound is a wave",
      intuition:`Sound is just air pressure wiggling up and down. A guitar string pushes air back and
        forth, and that wiggle — measured over time — <b>is</b> the signal. A pure tone needs only two
        knobs: how <b>fast</b> it wiggles (frequency → pitch) and how <b>big</b> the wiggle is
        (amplitude → loudness). Drag the sliders and press play to hear it.`,
      math:`<p>A pure tone is a sinusoid in time: $$x(t)=A\\,\\sin(2\\pi f t+\\varphi).$$</p>
        <p>A computer stores it as samples taken $f_s$ times per second:
        $$x[n]=A\\,\\sin\\!\\left(\\tfrac{2\\pi f n}{f_s}+\\varphi\\right).$$
        $A$ sets loudness, $f$ sets pitch, $\\varphi$ is the starting phase.</p>`,
      viz:WaveViz },
    { kicker:"02 · Sampling", title:"Snapshots in time",
      short:"Sampling & aliasing",
      intuition:`A computer can't keep a perfectly smooth curve — it takes rapid <b>snapshots</b>. The
        sample rate is how many snapshots per second. Take enough and the dots trace the wave faithfully.
        Take too few and a fast wiggle slips <b>between</b> the snapshots, and the signal gets misread as a
        slower one. Lower the rate and watch the red dots lose the wave.`,
      math:`<p>A signal sampled at $f_s$ can faithfully represent frequencies only below the
        <b>Nyquist limit</b> $f_s/2$.</p>
        <p>Anything higher <em>folds back</em> to a false lower frequency — <b>aliasing</b> — which is why
        the blue reconstruction can look like a completely different wave.</p>`,
      viz:SamplingViz },
    { kicker:"03 · Frequency", title:"Every sound is a sum of tones",
      short:"Fourier: the recipe",
      intuition:`Real sounds aren't single tones — they're many pure tones <b>stacked together</b>. This is
        the Fourier idea: any signal can be broken into its sinusoidal ingredients. On the left is the
        combined wiggle; on the right is its <b>recipe</b> — one bar per ingredient frequency. Move the
        sliders and watch the wave reshape as you change the mix.`,
      math:`<p>The Discrete Fourier Transform turns $N$ samples into frequency coefficients:
        $$X_k=\\sum_{n=0}^{N-1}x_n\\,e^{-i\\,2\\pi k n/N}.$$</p>
        <p>Each magnitude $|X_k|$ tells you how much of frequency $k$ is present — exactly the height of
        each bar on the right.</p>`,
      viz:SpectrumViz },
    { kicker:"04 · Time + frequency", title:"The spectrogram",
      short:"Live spectrogram (WebGL)",
      intuition:`One spectrum describes a single instant. But music and speech <b>change over time</b>, so
        we slide a short window along the signal, take the spectrum of each slice, and stack them: time runs
        across, frequency up, and brightness shows energy. That stacked picture is a <b>spectrogram</b>.
        Try the sweep tone, then your own voice.`,
      math:`<p>This is the <b>Short-Time Fourier Transform</b>:
        $$\\text{STFT}(m,k)=\\sum_{n} x[n]\\,w[n-m]\\,e^{-i\\,2\\pi k n/N},$$
        displayed as $|\\text{STFT}|^2$.</p>
        <p>The window $w$ trades time detail for frequency detail. The browser's <code>AnalyserNode</code>
        runs this live every frame.</p>`,
      viz:SpectrogramViz },
  ];

  // =========================================================
  //  APP SHELL  (guided next/back navigation)
  // =========================================================
  let idx=0, current=null;
  const theory=$("#theory"), stageCanvas=$("#stagecanvas"), controlsEl=$("#controls"),
        dotsEl=$("#dots"), counterEl=$("#counter"), backBtn=$("#back"), nextBtn=$("#next"),
        stepTitle=$("#steptitle");

  STEPS.forEach((s,i)=>{ const d=el("b"); d.addEventListener("click",()=>go(i)); dotsEl.appendChild(d); });

  function renderTheory(s){
    theory.innerHTML="";
    const wrap=el("div","stepfade");
    wrap.appendChild(el("div","kicker",s.kicker));
    wrap.appendChild(el("h2",null,s.title));
    wrap.appendChild(el("p","intuition",s.intuition));
    const mw=el("div","mathwrap");
    const tog=el("button","mathtoggle",`<span class="chev">▶</span> Show the math`);
    const body=el("div","mathbody",s.math);
    tog.addEventListener("click",()=>{ const open=body.classList.toggle("open"); tog.classList.toggle("open",open);
      tog.innerHTML=`<span class="chev">▶</span> ${open?"Hide":"Show"} the math`;
      if(open) renderMath(body); });
    mw.appendChild(tog); mw.appendChild(body); wrap.appendChild(mw);
    theory.appendChild(wrap);
  }

  function renderControls(viz){
    controlsEl.innerHTML="";
    (viz.controls||[]).forEach(c=>{
      if(c.type==="range"){
        const w=el("div","ctl");
        const lab=el("label",null,c.label); const inp=el("input"); inp.type="range";
        inp.min=c.min;inp.max=c.max;inp.step=c.step;inp.value=c.val();
        const v=el("span","val",c.fmt?c.fmt(+inp.value):inp.value);
        inp.addEventListener("input",()=>{c.on(+inp.value); v.textContent=c.fmt?c.fmt(+inp.value):inp.value;});
        w.append(lab,inp,v); controlsEl.appendChild(w);
      } else if(c.type==="seg"){
        const w=el("div","ctl"); w.appendChild(el("label",null,c.label));
        const seg=el("div","seg");
        c.opts.forEach(([val,txt])=>{ const b=el("button",null,txt); b.classList.toggle("active",c.val()===val);
          b.addEventListener("click",()=>{ [...seg.children].forEach(x=>x.classList.remove("active"));
            b.classList.add("active"); c.on(val); }); seg.appendChild(b); });
        w.appendChild(seg); controlsEl.appendChild(w);
      } else if(c.type==="play"){
        const b=el("button","playbtn",`▶ ${typeof c.label==="function"?c.label():c.label}`);
        b.addEventListener("click",()=>c.on()); controlsEl.appendChild(b);
      }
    });
    const err=el("span","errmsg"); err.id="sg-err"; controlsEl.appendChild(err);
  }

  function go(i){
    if(i<0||i>=STEPS.length) return;
    if(current&&current.unmount) current.unmount();
    stageCanvas.querySelectorAll("canvas,.hint,.axis-note").forEach(n=>n.remove());
    idx=i; const s=STEPS[i];
    renderTheory(s);
    const viz=s.viz(); current=viz;
    if(viz.note){ const n=el("div","axis-note",viz.note); stageCanvas.appendChild(n); }
    viz.mount(stageCanvas);
    if(viz.hint){ const h=el("div","hint",viz.hint); h.id="stage-hint"; stageCanvas.appendChild(h); }
    renderControls(viz);
    // header + footer state
    counterEl.textContent=`${String(i+1).padStart(2,"0")} / ${String(STEPS.length).padStart(2,"0")}`;
    [...dotsEl.children].forEach((d,j)=>{ d.classList.toggle("on",j===i); d.classList.toggle("done",j<i); });
    backBtn.disabled=i===0; nextBtn.disabled=i===STEPS.length-1;
    nextBtn.textContent = i===STEPS.length-1 ? "Done ✓" : "Next →";
    stepTitle.textContent = s.short;
  }
  function renderMath(node){
    if(window.renderMathInElement){ window.renderMathInElement(node,{delimiters:[
      {left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}]}); }
  }

  backBtn.addEventListener("click",()=>go(idx-1));
  nextBtn.addEventListener("click",()=>go(idx+1));
  window.addEventListener("keydown",e=>{ if(e.key==="ArrowRight")go(idx+1); if(e.key==="ArrowLeft")go(idx-1); });

  // wait for KaTeX (deferred) then start
  window.addEventListener("load",()=>go(0));
  if(document.readyState==="complete")go(0);
})();
</script>
</body>
</html>
